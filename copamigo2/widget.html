<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CopaMigo &middot; Chat Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#7a5080; --plum-light:#a87fae; --paper:#faf7f2;
    --stone:#d6cfc4; --ink:#2e2426; --muted:#6b5e60;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);
    margin:0;padding:1.5rem 1rem;display:flex;flex-direction:column;
    align-items:center;justify-content:center;min-height:100vh;
  }
  .widget-card{
    width:100%;max-width:400px;height:640px;max-height:88vh;
    background:#fff;border-radius:16px;overflow:hidden;
    box-shadow:0 10px 34px rgba(46,36,38,0.16);
    border:1px solid var(--stone);display:flex;flex-direction:column;
  }
  .widget-head{
    background:var(--plum);color:#fff;padding:0.85rem 1.1rem;flex:0 0 auto;
    display:flex;align-items:center;gap:0.6rem;
  }
  .widget-dot{width:9px;height:9px;border-radius:50%;background:#8fd19e;flex:0 0 auto;box-shadow:0 0 0 3px rgba(143,209,158,0.28);}
  .widget-title{font-family:'Lora',serif;font-size:1.15rem;font-weight:600;line-height:1.1;}
  .widget-title em{font-style:normal;}
  .widget-sub{font-size:0.72rem;opacity:0.9;margin-top:1px;}
  .widget-frame{flex:1 1 auto;width:100%;border:0;display:block;background:#fff;}
  .widget-cap{max-width:400px;margin:0.7rem auto 0;font-size:0.72rem;color:var(--muted);text-align:center;line-height:1.5;}
</style>
</head>
<body>
  <div class="widget-card">
    <div class="widget-head">
      <span class="widget-dot"></span>
      <div>
        <div class="widget-title">Copa<em>Migo</em></div>
        <div class="widget-sub">Your amigo for quick help</div>
      </div>
    </div>
    <iframe id="copa-frame" class="widget-frame" src="/copamigo2/" title="CopaMigo, tell it what is going on and it points you to help" allow="microphone"></iframe>
  </div>
  <p class="widget-cap">Standalone view of CopaMigo, the same tool embedded on the Student Resources page. Anonymous, AI-powered, it can be wrong so double-check anything important.</p>

<script>
(function(){
  var frame = document.getElementById('copa-frame');
  if(!frame) return;
  frame.addEventListener('load', function(){
    try {
      var d = frame.contentDocument;
      if(!d) return;
      // Reuse the exact tool inside; just strip the full-page chrome so it reads as a compact widget.
      var s = d.createElement('style');
      s.textContent = `
        [data-homenav],.project-footer,#reset-btn,header{display:none!important}
        html,body{height:100%!important;margin:0!important;background:#fff!important}
        #chat-screen{display:flex!important;flex-direction:column!important;height:100vh!important;max-height:100vh!important}
        #messages{flex:1 1 auto!important;overflow-y:auto!important;max-height:none!important}
        #input-area{flex:0 0 auto!important}
      `;
      d.head.appendChild(s);
    } catch(e){}
  });
})();
</script>
</body>
</html>

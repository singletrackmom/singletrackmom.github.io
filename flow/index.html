<title>Find Your Flow</title>
<script>
(function(){
  // Each edition shows on its date and stays until the next date arrives.
  // To add a new letter: append [YYYY-MM-DD, file] in date order, and update the noscript + manual link below to the newest.
  var sched=[
    ["2026-06-26","vol-13.html"],
    ["2026-06-27","vol-14.html"],
    ["2026-06-28","vol-15.html"],
    ["2026-06-29","vol-16.html"],
    ["2026-06-30","vol-17.html"],
    ["2026-07-01","vol-18.html"],
    ["2026-07-02","vol-19.html"],
    ["2026-07-03","vol-20.html"],
    ["2026-07-04","vol-21.html"]
  ];
  var n=new Date();
  var t=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
  var pick=sched[0][1];
  for(var i=0;i<sched.length;i++){ if(sched[i][0]<=t){ pick=sched[i][1]; } }
  window.location.replace(pick);
})();
</script>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="thumbTitle thumbDesc">
  <title id="thumbTitle">Student Journey Gap Analysis</title>
  <desc id="thumbDesc">A simplified student journey ribbon with seven stops: Find Maricopa, Apply, Enroll, Pay, Get help, Graduate, Work. The Get help stop opens into a small cluster of support service bubbles for Tutoring, Library, Counseling, and Career. The study covers 25,000 synthetic runs across 50 personas by 50 tasks by 10 colleges.</desc>

  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="60" y="52" font-family="Lora, Georgia, serif" font-size="26" font-weight="600" fill="#26221f">Student Journey Gap Analysis</text>

  <!-- Journey ribbon path -->
  <polyline points="60,150 173,165 287,176 400,180 513,176 627,165 740,150"
    fill="none" stroke="#d9c9e0" stroke-width="4"/>

  <!-- Ribbon stop labels -->
  <g font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#26221f" text-anchor="middle">
    <text x="60" y="116">Find Maricopa</text>
    <text x="173" y="131">Apply</text>
    <text x="287" y="142">Enroll</text>
    <text x="400" y="146">Pay</text>
    <text x="513" y="142" font-weight="600">Get help</text>
    <text x="627" y="131">Graduate</text>
    <text x="740" y="116">Work</text>
  </g>

  <!-- Ribbon stop circles -->
  <g stroke="#d9c9e0" stroke-width="2">
    <circle cx="60" cy="150" r="20" fill="#7a5080"/>
    <circle cx="173" cy="165" r="20" fill="#6b8f6e"/>
    <circle cx="287" cy="176" r="20" fill="#75592c"/>
    <circle cx="400" cy="180" r="20" fill="#94395a"/>
    <circle cx="513" cy="176" r="24" fill="#6d635f"/>
    <circle cx="627" cy="165" r="20" fill="#7a5080"/>
    <circle cx="740" cy="150" r="20" fill="#6b8f6e"/>
  </g>

  <!-- Connector into service cluster -->
  <path d="M 513 200 C 470 250, 430 275, 400 300" fill="none" stroke="#d9c9e0" stroke-width="3" stroke-dasharray="4 6"/>

  <!-- Service cluster hint (Get help) -->
  <g stroke="#d9c9e0" stroke-width="2" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">
    <circle cx="330" cy="320" r="34" fill="#7a5080"/>
    <text x="330" y="324">Tutoring</text>

    <circle cx="415" cy="300" r="34" fill="#6b8f6e"/>
    <text x="415" y="304">Library</text>

    <circle cx="470" cy="360" r="36" fill="#75592c"/>
    <text x="470" y="364">Counseling</text>

    <circle cx="375" cy="375" r="34" fill="#94395a"/>
    <text x="375" y="379">Career</text>
  </g>

  <!-- Headline total -->
  <text x="620" y="330" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="52" font-weight="600" fill="#7a5080">25,000</text>
  <text x="620" y="358" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#6d635f">SYNTHETIC RUNS</text>
  <text x="620" y="388" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" fill="#26221f">50 &#215; 50 &#215; 10</text>
</svg>

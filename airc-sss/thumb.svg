<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="thumbTitle thumbDesc">
  <title id="thumbTitle">Student Journey Gap Analysis</title>
  <desc id="thumbDesc">A low upward arc of the student journey from Find Maricopa through Apply, Enroll, Take classes, Pay, Graduate, and Work, with support-service names floating behind it as a faint word cloud, and the study total of 25,000 synthetic runs across 50 personas, 50 tasks, and 10 colleges.</desc>

  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="44" y="50" font-family="Lora, Georgia, serif" font-size="27" font-weight="600" fill="#26221f">Student Journey Gap Analysis</text>
  <text x="44" y="76" font-family="DM Sans, system-ui, sans-serif" font-size="15" fill="#6d635f">25,000 synthetic runs  &#183;  50 &#215; 50 &#215; 10</text>

  <!-- Services as a faint word cloud -->
  <g font-family="DM Sans, system-ui, sans-serif" font-weight="700" fill="#26221f" opacity="0.10">
    <text x="46" y="150" font-size="40">Advising</text>
    <text x="250" y="130" font-size="34">Tutoring</text>
    <text x="440" y="150" font-size="42">Library</text>
    <text x="620" y="132" font-size="30">Counseling</text>
    <text x="60" y="220" font-size="30">Financial aid</text>
    <text x="300" y="228" font-size="38">Community</text>
    <text x="540" y="222" font-size="32">Career services</text>
    <text x="120" y="292" font-size="34">Wellness</text>
    <text x="330" y="300" font-size="28">Accessibility</text>
    <text x="560" y="298" font-size="30">Food pantry</text>
  </g>

  <!-- Journey arc, low, curving up -->
  <polyline points="60,410 173,378 286,356 399,348 512,356 625,378 738,410"
    fill="none" stroke="#d9c9e0" stroke-width="3"/>

  <!-- Milestone dots -->
  <g stroke="#ffffff" stroke-width="1.5">
    <circle cx="60" cy="410" r="8" fill="#7a5080"/>
    <circle cx="173" cy="378" r="8" fill="#6b8f6e"/>
    <circle cx="286" cy="356" r="8" fill="#75592c"/>
    <circle cx="399" cy="348" r="11" fill="#94395a"/>
    <circle cx="512" cy="356" r="8" fill="#6d635f"/>
    <circle cx="625" cy="378" r="8" fill="#7a5080"/>
    <circle cx="738" cy="410" r="8" fill="#6b8f6e"/>
  </g>

  <!-- Milestone labels -->
  <g font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#26221f" text-anchor="middle">
    <text x="60" y="434">Find Maricopa</text>
    <text x="173" y="402">Apply</text>
    <text x="286" y="380">Enroll</text>
    <text x="399" y="374" font-size="15" font-weight="700">Take classes</text>
    <text x="512" y="380">Pay</text>
    <text x="625" y="402">Graduate</text>
    <text x="738" y="434">Work</text>
  </g>
</svg>

<svg viewBox="0 110 960 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">Student Journey Gap Analysis</title>
  <desc id="coverDesc">A tall curved arc of the student journey across nine milestones in order: Find Maricopa, Apply, Enroll, Pay, Take classes, Get support, Feel connected, Graduate, and Work. Floating above and below the arc like a faint word cloud, screened back so they are hard to see, are the many support services a student may never find: Advising, Tutoring, Library, Counseling, Clubs, Faculty, Financial aid, Community, Wellness, Math help, Basic needs, Accessibility, Make friends, Career services, Veterans center, and Food pantry. The study covers 25,000 synthetic runs across 50 personas by 50 tasks by 10 colleges.</desc>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>


  <!-- Services word cloud (unchanged positions; Disability Resources removed) -->
  <g font-family="DM Sans, system-ui, sans-serif" font-weight="700" fill="#26221f" opacity="0.10">
    <text x="60" y="152" font-size="50">Advising</text>
    <text x="380" y="140" font-size="36">Tutoring</text>
    <text x="720" y="150" font-size="46">Library</text>
    <text x="150" y="206" font-size="32">Counseling</text>
    <text x="560" y="200" font-size="40">Clubs</text>
    <text x="800" y="204" font-size="34">Faculty</text>
    <text x="290" y="330" font-size="42">Financial aid</text>
    <text x="610" y="332" font-size="44">Community</text>
    <text x="110" y="448" font-size="34">Wellness</text>
    <text x="320" y="472" font-size="40">Math help</text>
    <text x="560" y="452" font-size="30">Basic needs</text>
    <text x="720" y="492" font-size="32">Accessibility</text>
    <text x="70" y="548" font-size="32">Make friends</text>
    <text x="340" y="548" font-size="32">Career services</text>
    <text x="660" y="548" font-size="30">Veterans center</text>
    <text x="430" y="592" font-size="30">Food pantry</text>
  </g>

  <!-- Journey arc, taller, ends dropped -->
  <polyline points="60,440 165,340 270,256 375,200 480,180 585,200 690,256 795,340 900,440"
    fill="none" stroke="#d9c9e0" stroke-width="3"/>

  <!-- Journey milestone dots (small, on the curve) -->
  <g stroke="#ffffff" stroke-width="1.5">
    <circle cx="60" cy="440" r="8" fill="#7a5080"/>
    <circle cx="165" cy="340" r="8" fill="#6b8f6e"/>
    <circle cx="270" cy="256" r="8" fill="#75592c"/>
    <circle cx="375" cy="200" r="8" fill="#94395a"/>
    <circle cx="480" cy="180" r="8" fill="#6d635f"/>
    <circle cx="585" cy="200" r="8" fill="#7a5080"/>
    <circle cx="690" cy="256" r="8" fill="#6b8f6e"/>
    <circle cx="795" cy="340" r="8" fill="#75592c"/>
    <circle cx="900" cy="440" r="8" fill="#94395a"/>
  </g>

  <!-- Journey milestone labels (uniform, above the dots) -->
  <g font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#26221f" text-anchor="middle">
    <text x="60" y="424">Find Maricopa</text>
    <text x="165" y="324">Apply</text>
    <text x="270" y="240">Enroll</text>
    <text x="375" y="184">Pay</text>
    <text x="480" y="164">Take classes</text>
    <text x="585" y="184">Get support</text>
    <text x="690" y="240">Feel connected</text>
    <text x="795" y="324">Graduate</text>
    <text x="900" y="424">Work</text>
  </g>
</svg>
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">Student Journey Gap Analysis</title>
  <desc id="coverDesc">A student services ecosystem map. A left to right journey ribbon runs across eleven stops: Find Maricopa, Apply, Financial aid, Enroll, Pay, Take courses, Advising, Get help, Connect, Graduate, Work. Below, the Get help stop opens into a cluster of support service bubbles including Tutoring, Math help, Accessibility services, Library, Veterans center, Counseling, Career services, Food pantry, Basic needs, and Disability Resources, and the Connect stop opens into a belonging cluster of Make friends, Faculty, Clubs, and Community. The study covers 25,000 synthetic runs across 50 personas by 50 tasks by 10 colleges.</desc>

  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>

  <!-- Title block -->
  <text x="70" y="62" font-family="Lora, Georgia, serif" font-size="36" font-weight="600" fill="#26221f">Student Journey Gap Analysis</text>
  <text x="70" y="94" font-family="DM Sans, system-ui, sans-serif" font-size="16" fill="#6d635f">25,000 synthetic runs  &#183;  50 personas &#215; 50 tasks &#215; 10 colleges</text>

  <!-- Journey ribbon path -->
  <polyline points="70,200 176,215 282,229 388,240 494,247 600,250 706,247 812,240 918,229 1024,215 1130,200"
    fill="none" stroke="#d9c9e0" stroke-width="4"/>

  <!-- Ribbon stop labels (above) -->
  <g font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#26221f" text-anchor="middle">
    <text x="70" y="158">Find Maricopa</text>
    <text x="176" y="173">Apply</text>
    <text x="282" y="187">Financial aid</text>
    <text x="388" y="198">Enroll</text>
    <text x="494" y="205">Pay</text>
    <text x="600" y="208">Take courses</text>
    <text x="706" y="205">Advising</text>
    <text x="812" y="198" font-weight="600">Get help</text>
    <text x="918" y="187" font-weight="600">Connect</text>
    <text x="1024" y="173">Graduate</text>
    <text x="1130" y="158">Work</text>
  </g>

  <!-- Ribbon stop circles -->
  <g stroke="#d9c9e0" stroke-width="2">
    <circle cx="70" cy="200" r="24" fill="#7a5080"/>
    <circle cx="176" cy="215" r="24" fill="#6b8f6e"/>
    <circle cx="282" cy="229" r="24" fill="#75592c"/>
    <circle cx="388" cy="240" r="24" fill="#94395a"/>
    <circle cx="494" cy="247" r="24" fill="#6d635f"/>
    <circle cx="600" cy="250" r="24" fill="#7a5080"/>
    <circle cx="706" cy="247" r="24" fill="#6b8f6e"/>
    <circle cx="812" cy="240" r="28" fill="#94395a"/>
    <circle cx="918" cy="229" r="26" fill="#7a5080"/>
    <circle cx="1024" cy="215" r="24" fill="#75592c"/>
    <circle cx="1130" cy="200" r="24" fill="#6b8f6e"/>
  </g>

  <!-- Connectors from hubs down into clusters -->
  <path d="M 812 268 C 720 330, 600 360, 500 408" fill="none" stroke="#d9c9e0" stroke-width="3" stroke-dasharray="4 6"/>
  <path d="M 918 255 C 940 340, 955 400, 960 452" fill="none" stroke="#d9c9e0" stroke-width="3" stroke-dasharray="4 6"/>

  <!-- Section labels for clusters -->
  <text x="470" y="405" font-family="DM Sans, system-ui, sans-serif" font-size="12" letter-spacing="0.12em" fill="#6d635f" text-anchor="middle">SERVICES AROUND &#8220;GET HELP&#8221;</text>
  <text x="960" y="440" font-family="DM Sans, system-ui, sans-serif" font-size="12" letter-spacing="0.12em" fill="#6d635f" text-anchor="middle">BELONGING</text>

  <!-- Service cluster (Get help) -->
  <g stroke="#d9c9e0" stroke-width="2" font-family="DM Sans, system-ui, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">
    <circle cx="330" cy="470" r="42" fill="#7a5080"/>
    <text x="330" y="474">Tutoring</text>

    <circle cx="435" cy="440" r="42" fill="#6b8f6e"/>
    <text x="435" y="437">Math</text>
    <text x="435" y="451">help</text>

    <circle cx="558" cy="452" r="44" fill="#75592c"/>
    <text x="558" y="449">Accessibility</text>
    <text x="558" y="463">services</text>

    <circle cx="655" cy="502" r="42" fill="#94395a"/>
    <text x="655" y="506">Library</text>

    <circle cx="598" cy="575" r="42" fill="#6d635f"/>
    <text x="598" y="572">Veterans</text>
    <text x="598" y="586">center</text>

    <circle cx="488" cy="600" r="42" fill="#7a5080"/>
    <text x="488" y="604">Counseling</text>

    <circle cx="368" cy="590" r="42" fill="#6b8f6e"/>
    <text x="368" y="587">Career</text>
    <text x="368" y="601">services</text>

    <circle cx="298" cy="540" r="42" fill="#75592c"/>
    <text x="298" y="537">Food</text>
    <text x="298" y="551">pantry</text>

    <circle cx="470" cy="510" r="44" fill="#94395a"/>
    <text x="470" y="507">Basic</text>
    <text x="470" y="521">needs</text>

    <circle cx="578" cy="538" r="42" fill="#7a5080"/>
    <text x="578" y="535">Disability</text>
    <text x="578" y="549">Resources</text>
  </g>

  <!-- Belonging cluster (Connect) -->
  <g stroke="#d9c9e0" stroke-width="2" font-family="DM Sans, system-ui, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">
    <circle cx="905" cy="485" r="40" fill="#6b8f6e"/>
    <text x="905" y="489">Faculty</text>

    <circle cx="1005" cy="490" r="40" fill="#75592c"/>
    <text x="1005" y="494">Clubs</text>

    <circle cx="900" cy="575" r="42" fill="#94395a"/>
    <text x="900" y="572">Make</text>
    <text x="900" y="586">friends</text>

    <circle cx="1005" cy="575" r="42" fill="#7a5080"/>
    <text x="1005" y="579">Community</text>
  </g>
</svg>

  <circle cx="400" cy="392" r="15" fill="#6b8f6e"/>
  <circle cx="650" cy="392" r="15" fill="#6b8f6e"/>
  <text x="150" y="440" text-anchor="middle" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#26221f">Personalize</text>
  <text x="400" y="440" text-anchor="middle" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#26221f">Perform</text>
  <text x="650" y="440" text-anchor="middle" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#26221f">Prove</text>

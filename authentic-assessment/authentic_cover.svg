<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Simulation as Assessment, current research">
  <rect width="800" height="500" fill="#f4efe8"/>
  <rect x="22" y="22" width="756" height="456" rx="16" fill="#ffffff" stroke="#e5ddd1" stroke-width="1.5"/>
  <text x="60" y="96" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="3" fill="#6b8f6e">CURRENT RESEARCH</text>
  <text x="58" y="188" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="58" fill="#7a5080">Simulation</text>
  <text x="58" y="250" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="58" fill="#7a5080">as Assessment</text>
  <text x="60" y="300" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="21" fill="#6d635f">The exam becomes a task the student performs.</text>
  <line x1="150" y1="392" x2="400" y2="392" stroke="#7a5080" stroke-width="3"/>
  <line x1="400" y1="392" x2="650" y2="392" stroke="#7a5080" stroke-width="3"/>

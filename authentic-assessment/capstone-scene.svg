<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Time series of model accuracy over a 15-week project that rises steadily then drops sharply at a marked distribution-shift point and stays degraded"><rect width="1000" height="460" fill="#ffffff"/><line x1="110" y1="60" x2="110" y2="360" stroke="#e5ddd1" stroke-width="2"/><line x1="110" y1="360" x2="930" y2="360" stroke="#e5ddd1" stroke-width="2"/><line x1="560" y1="60" x2="560" y2="360" stroke="#94395a" stroke-width="2" stroke-dasharray="7 7" opacity="0.7"/><text x="568" y="66" font-family="DM Sans, sans-serif" font-size="17" fill="#94395a" text-anchor="start">distribution shift</text><path d="M130,300 L210,282 L290,288 L370,255 L450,265 L560,238" fill="none" stroke="#3d6b8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M560,238 L610,338 L690,312 L770,330 L850,300 L910,318" fill="none" stroke="#75592c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle r="7" fill="#7a5080"><animateMotion dur="5s" repeatCount="indefinite" path="M130,300 L210,282 L290,288 L370,255 L450,265 L560,238 L610,338 L690,312 L770,330 L850,300 L910,318"/></circle><text x="520" y="406" font-family="DM Sans, sans-serif" font-size="20" fill="#6d635f" text-anchor="middle">Project timeline (weeks 1–15)</text><text x="0" y="0" font-family="DM Sans, sans-serif" font-size="20" fill="#6d635f" text-anchor="middle" transform="translate(62,210) rotate(-90)">Model accuracy</text><text x="110" y="38" font-family="DM Sans, sans-serif" font-size="17" fill="#6d635f" text-anchor="start">A model that holds, until the data shifts mid-engagement.</text><circle cx="130" cy="90" r="7" fill="#3d6b8f"/><text x="144" y="95" font-family="DM Sans, sans-serif" font-size="15" fill="#6d635f" text-anchor="start">before shift</text><circle cx="260" cy="90" r="7" fill="#75592c"/><text x="274" y="95" font-family="DM Sans, sans-serif" font-size="15" fill="#6d635f" text-anchor="start">after shift</text></svg>
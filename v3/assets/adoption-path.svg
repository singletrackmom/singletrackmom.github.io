<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">Campus LMS adoption, in five steps</title>
  <desc id="d">Scattered tools, five options evaluated, the district platform joined, a pilot with early adopters, then a faculty-run center for teaching and learning.</desc>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="40" y="62" font-size="15" font-weight="700" letter-spacing="2" fill="#456546">CAMPUS LMS ADOPTION</text>
  <text x="40" y="100" font-size="26" font-weight="600" fill="#26221f">From scattered tools to one platform, and who owns it</text>
  <g font-size="15" fill="#26221f">
    <g>
      <rect x="40" y="150" width="168" height="170" rx="10" fill="#f7f4f8" stroke="#d9c9e0"/>
      <text x="56" y="184" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6d635f">1 · BEFORE</text>
      <text x="56" y="218" font-weight="600">Scattered tools</text>
      <text x="56" y="246" fill="#6d635f">Course websites,</text>
      <text x="56" y="268" fill="#6d635f">handouts, a shared</text>
      <text x="56" y="290" fill="#6d635f">drive, one-off builds</text>
    </g>
    <g>
      <rect x="228" y="150" width="168" height="170" rx="10" fill="#f7f4f8" stroke="#d9c9e0"/>
      <text x="244" y="184" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6d635f">2 · EVALUATE</text>
      <text x="244" y="218" font-weight="600">Five options</text>
      <text x="244" y="246" fill="#6d635f">Join, buy or build,</text>
      <text x="244" y="268" fill="#6d635f">weighed against</text>
      <text x="244" y="290" fill="#6d635f">requirements</text>
    </g>
    <g>
      <rect x="416" y="150" width="168" height="170" rx="10" fill="#f7f4f8" stroke="#d9c9e0"/>
      <text x="432" y="184" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6d635f">3 · DECIDE</text>
      <text x="432" y="218" font-weight="600">Join, not build</text>
      <text x="432" y="246" fill="#6d635f">The district platform</text>
      <text x="432" y="268" fill="#6d635f">fit the need and</text>
      <text x="432" y="290" fill="#6d635f">the budget</text>
    </g>
    <g>
      <rect x="604" y="150" width="168" height="170" rx="10" fill="#f7f4f8" stroke="#d9c9e0"/>
      <text x="620" y="184" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6d635f">4 · PILOT</text>
      <text x="620" y="218" font-weight="600">Early adopters</text>
      <text x="620" y="246" fill="#6d635f">Others joined once</text>
      <text x="620" y="268" fill="#6d635f">they saw it work</text>
    </g>
    <g>
      <rect x="792" y="150" width="168" height="170" rx="10" fill="#eff4ee" stroke="#cfe0cf"/>
      <text x="808" y="184" font-size="12" font-weight="700" letter-spacing="1.5" fill="#456546">5 · SUSTAIN</text>
      <text x="808" y="218" font-weight="600">Faculty-run center</text>
      <text x="808" y="246" fill="#6d635f">Teaching and</text>
      <text x="808" y="268" fill="#6d635f">learning owned by</text>
      <text x="808" y="290" fill="#6d635f">faculty, not IT</text>
    </g>
  </g>
  <g stroke="#6d635f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M211 235h12m-5-5l5 5-5 5"/><path d="M399 235h12m-5-5l5 5-5 5"/><path d="M587 235h12m-5-5l5 5-5 5"/><path d="M775 235h12m-5-5l5 5-5 5"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Campus LMS adoption</title><desc id="d">Before: course materials scattered across course websites, handouts, Word documents, a shared drive, a discussion board and an open-source system. Five options were evaluated and the district platform chosen. The campus moved onto one platform, with a pilot first and nearly all faculty following.</desc><rect width="1200" height="480" fill="#ffffff"/>

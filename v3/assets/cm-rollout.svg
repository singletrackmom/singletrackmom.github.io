<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Student Journey Study · Sponsor-Led Rollout</title><desc id="d">Phase one, the public student journey, is complete across ten colleges. The sponsor then briefs student services leaders on what the study is and is not. The next phase, inside the systems students sign in to, begins after that briefing.</desc><rect width="1200" height="480" fill="#ffffff"/>

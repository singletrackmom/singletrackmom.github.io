<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Center For Teaching, Learning And Engagement</title><desc id="d">About five teaching and learning centers at other colleges in the district were visited, a proposal for a faculty-run center was written with the Director of Training, and two vice presidents approved it. The Innovation Center in IT closed and the new center, focused on teaching and learning, opened.</desc><rect width="1200" height="480" fill="#ffffff"/>
<text x="48" y="58" font-size="15" font-weight="700" letter-spacing="2.4" fill="#456546">CENTER FOR TEACHING, LEARNING AND ENGAGEMENT</text>
<rect x="48" y="92" width="346" height="340" rx="14" fill="#f7f4f8" stroke="#d9c9e0"/><text x="72" y="130" font-size="13" font-weight="700" letter-spacing="2" fill="#6d635f">RESEARCH</text><text x="72" y="160" font-size="22" font-weight="600" fill="#26221f">Five district centers</text><text x="72" y="410" font-size="15" fill="#6d635f">Started by campus stakeholders</text>
<g transform="rotate(0 221.0 197.0)"><rect x="72" y="180" width="298" height="34" rx="8" fill="#ffffff" stroke="#b9a3c4" stroke-width="1.5"/><text x="88" y="202.0" font-size="15" fill="#26221f">Visited each one</text></g><g transform="rotate(0 221.0 238.0)"><rect x="72" y="221" width="298" height="34" rx="8" fill="#ffffff" stroke="#b9a3c4" stroke-width="1.5"/><text x="88" y="243.0" font-size="15" fill="#26221f">Compared the models</text></g>
<rect x="456" y="92" width="300" height="340" rx="14" fill="#f7f4f8" stroke="#d9c9e0"/><text x="480" y="130" font-size="13" font-weight="700" letter-spacing="2" fill="#6d635f">PROPOSE</text><text x="480" y="160" font-size="22" font-weight="600" fill="#26221f">A faculty-run center</text><text x="480" y="410" font-size="15" fill="#6d635f">Teaching support owned by faculty</text>
<g transform="rotate(0 606.0 197.0)"><rect x="480" y="180" width="252" height="34" rx="8" fill="#ffffff" stroke="#b9a3c4" stroke-width="1.5"/><text x="496" y="202.0" font-size="15" fill="#26221f">Written proposal</text></g><g transform="rotate(0 606.0 238.0)"><rect x="480" y="221" width="252" height="34" rx="8" fill="#ffffff" stroke="#b9a3c4" stroke-width="1.5"/><text x="496" y="243.0" font-size="15" fill="#26221f">Faculty-led structure</text></g>
<rect x="818" y="92" width="334" height="340" rx="14" fill="#f7f4f8" stroke="#d9c9e0"/><text x="842" y="130" font-size="13" font-weight="700" letter-spacing="2" fill="#6d635f">APPROVE</text><text x="842" y="160" font-size="22" font-weight="600" fill="#26221f">Two vice presidents</text><text x="842" y="410" font-size="15" fill="#6d635f">The Innovation Center became the center</text>
<g transform="rotate(0 985.0 197.0)"><rect x="842" y="180" width="286" height="34" rx="8" fill="#ffffff" stroke="#b9a3c4" stroke-width="1.5"/><circle cx="863" cy="197.0" r="9" fill="#456546"/><path d="M858 197.0l4 4 7-8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="882" y="202.0" font-size="15" font-weight="700" fill="#26221f">VP, Administrative Services</text></g><g transform="rotate(0 985.0 238.0)"><rect x="842" y="221" width="286" height="34" rx="8" fill="#ffffff" stroke="#b9a3c4" stroke-width="1.5"/><circle cx="863" cy="238.0" r="9" fill="#456546"/><path d="M858 238.0l4 4 7-8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="882" y="243.0" font-size="15" font-weight="700" fill="#26221f">VP, Academic Affairs</text></g>

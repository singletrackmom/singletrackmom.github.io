<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Help: a single point of contact</title><desc id="d">Four separate places to ask for help, a student helpdesk, a staff helpdesk, classroom technology support and campus police, became one phone number and one email address, with requests routed through helpdesk software to functions, not to individual people.</desc><rect width="1200" height="480" fill="#ffffff"/>
<text x="48" y="58" font-size="15" font-weight="700" letter-spacing="2.4" fill="#456546">HELP · SINGLE POINT OF CONTACT</text>

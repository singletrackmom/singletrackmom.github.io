<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="DM Sans, Segoe UI, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="5.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7a5080"/></marker></defs>
  <text x="40" y="40" font-size="18" font-weight="600" font-family="Lora, Georgia, serif" fill="#26221f">How it works</text>
  <text x="40" y="62" font-size="12.5" fill="#6d635f">The approach I&#8217;m testing. Same engine, two front doors: you direct it, it does the work and hands back an aligned course.</text>

  <!-- two front doors -->
  <rect x="70" y="86" width="340" height="78" rx="10" fill="#eef4ef" stroke="#6b8f6e"/>
  <text x="240" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#26221f">Dial Your Course</text>
  <text x="240" y="138" text-anchor="middle" font-size="12" fill="#456546">the tool: you check what to do</text>
  <text x="240" y="155" text-anchor="middle" font-size="11" fill="#6d635f">outcomes, alignment, seat time, accessibility, AI-resistance</text>

  <rect x="490" y="86" width="340" height="78" rx="10" fill="#f7f4f8" stroke="#7a5080"/>
  <text x="660" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#26221f">A Claude skill</text>
  <text x="660" y="138" text-anchor="middle" font-size="12" fill="#7a5080">the prompt: you tell it what to do</text>
  <text x="660" y="155" text-anchor="middle" font-size="11" fill="#6d635f">same standards, written into the skill</text>

  <!-- converge -->
  <path d="M240,164 C240,196 450,196 450,214" fill="none" stroke="#7a5080" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M660,164 C660,196 450,196 450,214" fill="none" stroke="#7a5080" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- engine -->
  <rect x="320" y="216" width="260" height="58" rx="10" fill="#7a5080"/>
  <text x="450" y="242" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">The build engine</text>
  <text x="450" y="261" text-anchor="middle" font-size="11.5" fill="#efe7f0">reads what you checked or prompted</text>
  <path d="M450,274 L450,300" fill="none" stroke="#7a5080" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- agents -->
  <rect x="150" y="302" width="600" height="76" rx="10" fill="#f7f4f8" stroke="#d9c9e0"/>
  <text x="450" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#26221f">Calls in the agent panel to do the work</text>
  <g font-size="12" fill="#26221f">
    <rect x="185" y="340" width="160" height="26" rx="13" fill="#ffffff" stroke="#6b8f6e"/><text x="265" y="357" text-anchor="middle">Subject-matter expert</text>
    <rect x="370" y="340" width="160" height="26" rx="13" fill="#ffffff" stroke="#6b8f6e"/><text x="450" y="357" text-anchor="middle">Instructional designer</text>
    <rect x="555" y="340" width="160" height="26" rx="13" fill="#ffffff" stroke="#6b8f6e"/><text x="635" y="357" text-anchor="middle">Synthetic student</text>
  </g>
  <path d="M450,378 L450,404" fill="none" stroke="#7a5080" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- standards -->
  <rect x="150" y="406" width="600" height="60" rx="10" fill="#f4efe8" stroke="#e5ddd1"/>
  <text x="450" y="430" text-anchor="middle" font-size="13" font-weight="600" fill="#26221f">Built or checked against the standards</text>
  <text x="450" y="452" text-anchor="middle" font-size="11.5" fill="#6d635f">measurable outcomes &amp; alignment &#183; vetted OER &#183; seat time &#183; WCAG accessibility &#183; AI-resistant assessment</text>
  <path d="M450,466 L450,492" fill="none" stroke="#7a5080" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- output -->
  <rect x="300" y="494" width="300" height="52" rx="10" fill="#456546"/>
  <text x="450" y="519" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">An aligned course</text>
  <text x="450" y="537" text-anchor="middle" font-size="11" fill="#dfeadf">built from scratch, or an existing one checked</text>

  <!-- human banner -->
  <text x="450" y="578" text-anchor="middle" font-size="12.5" font-style="italic" fill="#7a5080">A human directs the whole process and owns every decision. Nothing ships unreviewed.</text>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WGU Interview Flashcards</title>
<style>
  :root{
    --bg:#f3efe8;--panel:#ffffff;--line:#e0d9cd;--ink:#1d1b18;--muted:#6f675d;
    --soft:#8a8174;--accent:#9c5a34;--band:#1d1b18;--gold:#b6873f;--green:#3f6f4a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  header{background:var(--band);color:#f3efe8;padding:22px 20px;text-align:center}
  header .eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--gold);margin:0 0 6px}
  header h1{margin:0;font-size:23px}
  header a.back{color:#d8cfc1;font-size:13px;text-decoration:none;display:inline-block;margin-top:10px}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 50px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:4px 2px 10px}
.meta .deck{font-weight:600;color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:16px;padding:6px 11px;font-size:12px;cursor:pointer}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    min-height:330px;padding:26px 22px;display:flex;flex-direction:column;justify-content:center;
    text-align:center;cursor:pointer;position:relative}
.card .side{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--soft);position:absolute;top:14px;left:0;right:0}
.card .qtag{position:absolute;top:14px;right:16px;font-size:12px;color:var(--soft)}
.card .body{font-size:19px}
.card.answer{background:#f6efe2}
.card .body strong{color:var(--accent)}
.hint{text-align:center;font-size:12px;color:var(--soft);margin:10px 0 16px}
.controls{display:flex;gap:10px;margin-top:6px}
.controls button{flex:1;border:0;border-radius:10px;padding:14px;font-size:15px;cursor:pointer}
.controls .flip{background:var(--accent);color:#fff}
.controls .prev.controls .next{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.row2{display:flex;gap:10px;margin-top:10px}
.row2 button{flex:1;border-radius:10px;padding:12px;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--panel)}
.row2 .know{color:var(--green);border-color:var(--green)}
.row2 .review{color:var(--accent);border-color:var(--accent)}
.row2 .shuffle{color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:4px;margin:12px 0 2px;overflow:hidden}
.progress > div{height:100%;background:var(--green);width:0%}
.tip{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:18px}
</style>
</head>
<body>
<header>
  <p class="eyebrow">Future of Education Strategist, AI Innovator</p>
  <h1>WGU Interview Flashcards</h1>
  <a class="back" href="index.html">&larr; Back to the hub</a>
</header>
<div class="wrap">
  <div class="filters" id="filters"></div>
  <div class="meta">
    <span class="deck" id="deck"></span>
    <span id="counts">known 0 &middot; review 0</span>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div class="card" id="card" onclick="flip()">
    <div class="side" id="side">Question</div>
    <div class="qtag" id="qtag"></div>
    <div class="body" id="body"></div>
  </div>
  <div class="hint">Tap the card to flip</div>
  <div class="controls">
    <button class="prev" onclick="prev(event)">&larr; Prev</button>
    <button class="flip" onclick="flip(event)">Flip</button>
    <button class="next" onclick="next(event)">Next &rarr;</button>
  </div>
  <div class="row2">
    <button class="know" onclick="mark('known',event)">Got it</button>
    <button class="review" onclick="mark('review',event)">Review again</button>
    <button class="shuffle" onclick="shuffle(event)">Shuffle</button>
  </div>
  <div class="tip">Use the filters to drill one area at a time. The &ldquo;Your story&rdquo; cards are what you say when they ask what you bring, practice those out loud.</div>
</div>
<script>
const CARDS=[
// THE ROLE
{cat:"The role",q:"What is the job title and team?",a:"<strong>Future of Education Strategist, AI Innovator</strong> on the <strong>Program Experience Futures</strong> team."},
{cat:"The role",q:"What does this role actually do?",a:"Set program-experience <strong>strategy</strong> scout emerging tech (especially AI), turn it into <strong>pilots that scale</strong> analyze data, and align academic, product, and technology teams."},
{cat:"The role",q:"Format and pay band?",a:"Salt Lake City, <strong>hybrid</strong>. Roughly <strong>$97K to $146K</strong>."},
{cat:"The role",q:"The six things this role screens for?",a:"1) Scalable, learning-science-grounded design. 2) Product design thinking. 3) Translating AI into practical innovation. 4) Cross-team collaboration in a matrixed org. 5) Strategy to pilots to scale. 6) Raising the innovation bar across centralized curriculum."},
// WGU
{cat:"WGU",q:"What is WGU&rsquo;s mission?",a:"<strong>Expand access to higher education for working adults</strong> and help them graduate into better futures for their families."},
{cat:"WGU",q:"How big is WGU, and what kind of institution?",a:"<strong>~192,000+ students</strong> nonprofit, fully online, founded by U.S. governors."},
{cat:"WGU",q:"What is competency-based education (CBE)?",a:"Students progress by <strong>demonstrating competency on assessments, not seat time</strong>. Self-paced."},
{cat:"WGU",q:"WGU&rsquo;s tuition model?",a:"<strong>Flat-rate subscription per term</strong> so finishing faster saves the student money."},
{cat:"WGU",q:"Program Mentors vs Evaluators?",a:"<strong>Program Mentors</strong> guide a student from enrollment to graduation. <strong>Evaluators</strong> score objective and performance assessments against rubrics."},
{cat:"WGU",q:"What does &ldquo;centralized curriculum&rdquo; mean here?",a:"Curriculum is <strong>built once and delivered at scale</strong> to all students. That is the context for &ldquo;raise the bar across centralized curriculum.&rdquo;"},
{cat:"WGU",q:"What is WGU Labs?",a:"WGU&rsquo;s <strong>research and innovation arm</strong> focused on <strong>responsible, efficacy-tested AI</strong>. Real studies, not hype. It runs an <strong>AI Playground</strong> of tools."},
{cat:"WGU",q:"WGU&rsquo;s big 2026 AI milestone?",a:"Launched the nation&rsquo;s first at-scale, competency-based <strong>B.S. in AI Engineering</strong>."},
{cat:"WGU",q:"WGU and Aera?",a:"A partnership bringing <strong>AI to student support services</strong> which is exactly your Student Support and Success domain and CopaMigo lane."},
{cat:"WGU",q:"WGU&rsquo;s AI stance to echo back?",a:"<strong>Responsible, ethical, efficacy-tested AI with a human in the loop.</strong> Measure whether it improves outcomes, do not chase hype."},
// YOUR STORY
{cat:"Your story",q:"Your 60-second &ldquo;why WGU&rdquo;?",a:"The mission is the work I have spent my career on, expanding access for working adults. I am a builder who turns AI into practical tools, and <strong>competency-based learning fits how I already teach</strong> experientially, with students proving what they can do on real projects."},
{cat:"Your story",q:"Scalable, learning-science-grounded design, your proof?",a:"The <strong>AVC 100 redesign</strong>: grounded in retention research, built as a <strong>reusable template</strong> adjuncts can run, driven by success-rate data."},
{cat:"Your story",q:"Product design thinking, your proof?",a:"<strong>Render</strong>: built from a real classroom observation, student-centered, <strong>no PII</strong> and students keep it after graduation."},
{cat:"Your story",q:"Translating AI into practical innovation, your proof?",a:"The <strong>AI-literacy unit and judgment teaching</strong> in the capstone, plus the <strong>Render and CopaMigo</strong> prototypes and agent-building."},
{cat:"Your story",q:"Cross-team collaboration in a matrixed org, your proof?",a:"Co-chair of the <strong>10-college ARC Student Support and Success domain</strong>; product manager at ProQuest working from requirements engineers built; directing developers as a director of instructional technology."},
{cat:"Your story",q:"Strategy to pilot to scale, your proof?",a:"The <strong>10-college UX study</strong> turning into a prioritized, <strong>human-in-the-loop AI roadmap</strong> with Fall 2026 pilots."},
{cat:"Your story",q:"Raising the bar across centralized curriculum, your proof?",a:"Adopting <strong>district-shared courses</strong> building <strong>stackable microcredentials</strong> and founding the <strong>Faculty AI Community of Practice</strong>."},
{cat:"Your story",q:"Data-analysis proof?",a:"Usability studies, service crosswalks, persona research, and outcome metrics in <strong>Qualtrics and Tableau</strong>; analytics on a low success rate drove the AVC 100 redesign."},
{cat:"Your story",q:"Project-management proof?",a:"Led a campus <strong>LMS evaluation and RFP</strong> end to end; <strong>ProQuest product manager</strong> owning software from requirements to launch; built Render end to end."},
{cat:"Your story",q:"Accessibility proof?",a:"<strong>Quality Matters and OSCQR lead reviewer</strong> evaluating and remediating to WCAG and ADA, plus this year&rsquo;s federal accessibility-mandate work across my courses."},
{cat:"Your story",q:"Your signature theme to repeat?",a:"<strong>No-PII, data-sovereign, human-in-the-loop AI</strong> that makes staff and students&rsquo; lives easier without replacing anyone."},
{cat:"Your story",q:"Your two-decade arc?",a:"<strong>11 years a program director</strong> (2011 to 2022) plus <strong>7 years a director of instructional technology</strong> (2004 to 2011), and a stint as a ProQuest product manager."},
{cat:"Your story",q:"How to handle the degree question?",a:"Lead with the <strong>M.Ed. in Educational Technology</strong> (adult online learning) for the requirement; the <strong>BFA</strong> grounds your UX and design eye. The BFA is not in education, do not imply it is."},
// SCRUM (just enough)
{cat:"Scrum",q:"What is Scrum, in one line?",a:"A <strong>lightweight framework</strong> for delivering value in short, <strong>inspect-and-adapt</strong> cycles."},
{cat:"Scrum",q:"What does a Product Owner own?",a:"<strong>Value</strong>: the Product Goal and the <strong>ordered Product Backlog</strong>. They can delegate the work but stay accountable, and they say no to protect the goal."},
{cat:"Scrum",q:"The Scrum loop in one phrase?",a:"<strong>Inspect and adapt</strong>: ship a thin increment, check the real result, adjust."},
{cat:"Scrum",q:"How do you talk about your Scrum cert?",a:"&ldquo;<strong>PSPO I is in progress, finishing this summer.</strong>&rdquo; Never say &ldquo;certified.&rdquo;"},
{cat:"Scrum",q:"How would you run an AI pilot the Scrum way?",a:"Order a backlog by <strong>student impact</strong> ship a thin increment, test efficacy with real data, then scale. <strong>Outcomes over outputs.</strong>"},
// STAY HONEST
{cat:"Stay honest",q:"Your exact committee role?",a:"Co-chair of the <strong>Student Support and Success domain only</strong> not the whole AI committee."},
{cat:"Stay honest",q:"Faculty AI Community of Practice status?",a:"<strong>Launching Fall 2026</strong> not already running."},
{cat:"Stay honest",q:"How do you frame CBE?",a:"<strong>Eager to design within CBE</strong>; you are not claiming CBE experience."},
{cat:"Stay honest",q:"Render&rsquo;s status?",a:"<strong>Built and heading to its first pilot</strong> (Fall 2026), not a finished production tool."},
{cat:"Stay honest",q:"The numbers rule?",a:"<strong>No invented numbers.</strong> Say &ldquo;improved completion,&rdquo; not a percentage you cannot back up."}
];

const CATS=["All","The role","WGU","Your story","Scrum","Stay honest"];
let filter="All";
let order=[], pos=0, showingAnswer=false;
let status=JSON.parse(localStorage.getItem('wgu_fc')||'{}');

function buildFilters(){
  const f=document.getElementById('filters');
  f.innerHTML='';
  CATS.forEach(c=>{
    const b=document.createElement('button');
    b.textContent=c; if(c===filter)b.className='on';
    b.onclick=()=>{filter=c; rebuild();};
    f.appendChild(b);
  });
}
function rebuild(){
  order=CARDS.map((_,i)=>i).filter(i=> filter==="All"||CARDS[i].cat===filter);
  pos=0; showingAnswer=false; buildFilters(); render();
}
function render(){
  if(order.length===0)return;
  const i=order[pos], c=CARDS[i];
  document.getElementById('side').textContent= showingAnswer?'Answer':'Question';
  document.getElementById('qtag').textContent=(pos+1)+' / '+order.length;
  document.getElementById('body').innerHTML= showingAnswer? c.a : c.q;
  document.getElementById('card').classList.toggle('answer',showingAnswer);
  document.getElementById('deck').textContent=c.cat;
  let k=0,r=0; for(const key in status){ if(status[key]==='known')k++; if(status[key]==='review')r++; }
  document.getElementById('counts').innerHTML='known '+k+' &middot; review '+r;
  document.getElementById('bar').style.width=(100*k/CARDS.length)+'%';
}
function flip(e){ if(e)e.stopPropagation(); showingAnswer=!showingAnswer; render(); }
function next(e){ if(e)e.stopPropagation(); pos=(pos+1)%order.length; showingAnswer=false; render(); }
function prev(e){ if(e)e.stopPropagation(); pos=(pos-1+order.length)%order.length; showingAnswer=false; render(); }
function mark(s,e){ if(e)e.stopPropagation(); status[order[pos]]=s; localStorage.setItem('wgu_fc',JSON.stringify(status)); next(); }
function shuffle(e){ if(e)e.stopPropagation(); for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} pos=0; showingAnswer=false; render(); }
rebuild();
</script>
</body>
</html>

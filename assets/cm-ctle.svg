<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Teaching and learning center proposal</title><desc id="d">About five teaching and learning centers at other colleges in the district were visited, a proposal for a faculty-run center was written with the Director of Training, and two vice presidents approved it. The Innovation Center in IT closed and the new center opened.</desc><rect width="1600" height="1000" fill="#ffffff"/>
<text x="70" y="112" font-size="26" font-weight="700" letter-spacing="4" fill="#456546">CENTER FOR TEACHING, LEARNING AND ENGAGEMENT</text>

<rect x="577" y="170" width="446" height="750" rx="18" fill="#f7f4f8" stroke="#d9c9e0" stroke-width="1.5"/><text x="607" y="228" font-size="19" font-weight="700" letter-spacing="3" fill="#6d635f">PROPOSE</text><text x="607" y="274" font-size="30" font-weight="600" fill="#26221f">A faculty-run center</text><text x="607" y="884" font-size="21" fill="#6d635f">Owned by faculty</text>

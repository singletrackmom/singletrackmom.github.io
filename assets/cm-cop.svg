<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">AI community of practice</title><desc id="d">Early adopters among faculty, staff and administrators form one community of thirty members that meets monthly. Its four lines of work are authentic assessment, AI ethics testing, emerging AI sessions, and input to the district.</desc><rect width="1600" height="1000" fill="#ffffff"/>
<text x="70" y="112" font-size="26" font-weight="700" letter-spacing="4" fill="#456546">AI COMMUNITY OF PRACTICE</text>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  ===================================================================
  TOOL TEMPLATE, running tool page.
  Use for: an interactive tool, a built course, a family page, or a
  newsletter. Do NOT use it for a case study or a PRD: use page.html.

  GOAL      Start every tool page already carrying the universal
            requirements (language, title, social tags, skip link,
            main, header, footer) without stapling the content-page
            heading system onto a tool.
  AUDIENCE  Any Claude session, or Michelle, building a new tool page.
  PROCESS   1. Copy this file to the tool directory and rename it.
            2. Replace everything written inside [square brackets].
            3. Build the tool interface inside the marked region.
            4. Run python3 tools/preflight.py and paste the output.
               Never call the page done without that output.

  THE TWO-PAGE-TYPES RULE, the most common mistake on this site.
  A tool carries NO heading system: no h2, no h3, no category eyebrow,
  no lead paragraph, and no Goal, Audience, Process. That description
  belongs on the project overview page and is never duplicated here.
  The h1 stays, because a page without one fails accessibility.
  The only shared element a tool adopts is the standardized return
  link below. A tool keeps its own interface and its own styles, and
  is the only place on the site where content may span full width.
  The header, the nav link set, and the footer are still locked.
  ===================================================================
-->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#7a5080">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Unique title. Pattern: tool name, middot, Michelle Blomberg. -->
<title>[Tool name] &middot; Michelle Blomberg</title>

<!-- One sentence, about 150 characters, describing what the tool does. -->
<meta name="description" content="[One sentence describing what the tool does and who uses it, about 150 characters.]">

<!-- Social sharing. The image must be a 1200x630 PNG at an absolute URL. Never an SVG. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://michelleblomberg.com/[tool-directory]/">
<meta property="og:title" content="[Tool name]">
<meta property="og:description" content="[The same sentence as the meta description.]">
<meta property="og:image" content="https://michelleblomberg.com/[tool-directory]/[tool]-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
/* Standardized tool return link. Values from the website-style-guide skill:
   DM Sans, 0.8rem, weight 600, plum because it is a link, uppercase,
   letter-spacing 0.08em, left-aligned to the margin, leading arrow.
   Same wording on every tool. Never centered, never another font. */
.tool-return{font-family:'DM Sans',sans-serif;font-size:0.8rem;font-weight:600;
  letter-spacing:0.08em;text-transform:uppercase;margin:0 0 1.6rem}
.tool-return a{color:var(--plum);text-decoration:none}

/* Tool interface styles go here. Keep to the palette in /assets/site.css:
   solid colours only, never a gradient. A tool may widen its own working
   area, but the locked header and footer keep their 1000px band. */
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<!-- LOCKED HEADER. Identical on every page. Do not add a page-specific nav link. -->
<header class="site-head">
  <div class="site-bar">
    <a class="site-name" href="/">Michelle Blomberg</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/#work">Work</a>
      <a href="/about.html">About</a>
    </nav>
  </div>
</header>

<main id="main">

  <!-- Standardized return link. Point it at this tool&rsquo;s overview page. -->
  <p class="tool-return"><a href="/">&larr; Back to overview</a></p>

  <!-- Exactly one h1: the tool name. No eyebrow, no lead, no h2 or h3 below it. -->
  <h1>[Tool name]</h1>

  <!-- =============================================================
       TOOL INTERFACE
       Build the working interface here. Accessibility still applies:
       every control is a real button or link, never a clickable div;
       every form control has a label; every image has real alt text;
       every iframe has a title; focus stays visible.
       ============================================================= -->

</main>

<!-- LOCKED FOOTER. Sits OUTSIDE main so its left edge lines up. Nothing else in it. -->
<footer class="sitefoot">
<div class="foot-links"><a href="/">Home</a><a href="/#work">Work</a><a href="/about.html">About</a><a href="#" class="mailme">Email</a><a href="#">Top &uarr;</a></div>
<div style="margin-top:0.5rem;font-size:0.8rem">&copy; 2026 Michelle Blomberg. All rights reserved.</div>
</footer>
<script>
(function(){
  var u=['michelleblomberg','gmail','com'];
  function mmToast(el,msg){var t=document.createElement('span');t.textContent=msg;t.setAttribute('role','status');t.style.cssText='margin-left:.5rem;font-size:.8rem;color:#456546;font-weight:600;white-space:nowrap';el.insertAdjacentElement('afterend',t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2600);}
  document.addEventListener('click',function(e){
    var a=e.target.closest && e.target.closest('.mailme');
    if(!a) return;
    e.preventDefault();
    var email=u[0]+String.fromCharCode(64)+u[1]+'.'+u[2];
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(email).then(function(){mmToast(a,'Copied '+email);},function(){});}
    var gm='https://mail.google.com/mail/?view=cm&fs=1&tf=1&to='+encodeURIComponent(email);
    var w=window.open(gm,'_blank','noopener'); if(!w){ try{window.location.href='mai'+'lto:'+email;}catch(_){}}
  });
})();
</script>
</body>
</html>
